services:
  mushpi:
    image: ghcr.io/mushroom-pi/mushpi:${MUSHPI_IMAGE_TAG:-latest}

    # Developer source build (build context = this repository root; the sibling
    # sub-repos are materialized as transient clones — see REFERENCE.md — so a
    # bare clone has nothing to build):
    #   build:
    #     context: .
    #     args:
    #       VITE_API_BASE_URL: /

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env          # PICO_ANNOUNCE_SECRET, optional APP_HOST

    environment:
      NODE_ENV: prod
      PORT: "3000"
      SQLITE_PATH: /data/app.sqlite
      UPLOAD_DIR: /data
      LOGS_PATH: /data/logs

    volumes:
      # Persists SQLite DB + uploaded images + logs across restarts/reimages.
      # Host directory is MUSHPI_DATA_DIR (set in .env or the environment);
      # defaults to ./mushpi-data next to this compose file. It must be writable by
      # UID 1000 (the image's `node` user — the Pi 'pi' user matches); the
      # container's entrypoint (scripts/docker-entrypoint.sh) checks this on
      # start and fails with a clear message. If it reports the directory is
      # root-owned, fix it on the host:
      #   sudo chown -R 1000:1000 <MUSHPI_DATA_DIR>
      - "${MUSHPI_DATA_DIR:-./mushpi-data}:/data"
